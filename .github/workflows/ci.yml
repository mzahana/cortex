name: CI

# T0.8 — lint / typecheck / test / build, gated on a clean checkout. No real
# secrets are required anywhere in this pipeline: every credential below is
# an ephemeral, CI-only value for a throwaway service container or a
# check-only settings module (never TUNNEL_TOKEN/BREVO_API_KEY/real DB creds).
on:
  push:
    branches: ["master", "main"]
    # Release trigger. Pushing an annotated `vX.Y.Z` tag is the ONE action that
    # cuts a release: it gates on `version-consistency`, publishes the
    # version-tagged Docker Hub images, and creates the GitHub Release from
    # this repo's CHANGELOG. See "Cutting a release" in docs/development.md.
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint (ruff + black --check)
  # ---------------------------------------------------------------------------
  backend-lint:
    name: backend / lint (ruff, black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt
      - name: ruff check
        working-directory: backend
        run: ruff check .
      - name: black --check
        working-directory: backend
        run: black --check .

  # ---------------------------------------------------------------------------
  # Backend: typecheck (mypy)
  # ---------------------------------------------------------------------------
  backend-typecheck:
    name: backend / typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt
      - name: mypy
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          # mypy/django-stubs only needs settings to *import* cleanly, not a
          # real DB — sqlite keeps this job DB-free and fast.
          SECRET_KEY: ci-mypy-placeholder-not-a-real-secret
          DATABASE_URL: sqlite:///ci-mypy-placeholder.db
        run: mypy apps config conftest.py

  # ---------------------------------------------------------------------------
  # Backend: test (pytest + pytest-django) against a throwaway Postgres 16,
  # plus migrate up/down/up and `check --deploy` (prod settings) — all against
  # the same service container.
  # ---------------------------------------------------------------------------
  backend-test:
    name: backend / test + migrate up/down/up + check --deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cortex
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Owner/migration role — matches docker-compose's `migrate` one-off
      # (see docker-compose.yml). Runtime app role for RLS is provisioned BY
      # the migrations themselves (tenancy.0003_app_db_role), using
      # APP_DB_USER/APP_DB_PASSWORD below — nothing extra to seed here.
      DATABASE_URL: postgres://cortex:cortex_ci_password@localhost:5432/cortex
      APP_DB_USER: cortex_app
      APP_DB_PASSWORD: cortex_app_ci_password
      SECRET_KEY: ci-throwaway-secret-key-not-used-anywhere-real
      ALLOWED_HOSTS: testserver,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt

      # --- Migrations up / down / up (dev settings: no ALLOWED_HOSTS/HSTS
      # constraints to fight, matching how `migrate` runs in docker-compose) ---
      - name: Migrate up
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: python manage.py migrate --noinput

      - name: Migrate down (full reverse, proves reversibility)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          python manage.py migrate tenancy zero --noinput
          python manage.py migrate rbac zero --noinput
          python manage.py migrate projects zero --noinput
          python manage.py migrate accounts zero --noinput

      - name: Migrate up again
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: python manage.py migrate --noinput

      # --- `check --deploy` MUST run under prod settings (dev settings emit
      # W-warnings by design — see docs review note in T0.8 task) ---
      - name: manage.py check --deploy (prod settings)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: cortex.example.com
          CSRF_TRUSTED_ORIGINS: https://cortex.example.com
        run: python manage.py check --deploy

      # --- pytest / pytest-django. Runs as the OWNER role (see
      # config/settings/test.py's docstring): ordinary @pytest.mark.django_db
      # tests exercise the app-level tenant filter but bypass RLS by table
      # ownership. The `app_role_connection` fixture (backend/conftest.py)
      # opens a second, non-superuser `cortex_app` connection to the SAME test
      # DB for the RLS-specific assertion T0.9 needs — see that fixture and
      # `apps/common/tests/test_smoke.py::test_app_role_connection_is_rls_subject`
      # for the harness proof. ---
      - name: pytest
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest -v

  # ---------------------------------------------------------------------------
  # Frontend: lint (eslint) + typecheck (tsc) + build (vite)
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend / lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck
      - name: vite build
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build images: the shared web/worker app image, plus a `docker compose
  # config` validation of the full 7-service topology. Depends on the
  # frontend build succeeding (nginx serves frontend/dist) and both backend
  # gates passing, so a broken app never gets an image built for it.
  # ---------------------------------------------------------------------------
  build-images:
    name: build images (app + compose config)
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck, backend-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the shared web/worker app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: cortex-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the nginx image (frontend baked in at build time)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: false
          tags: cortex-nginx:ci
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
      - name: docker compose config (validate the 7-service topology)
        run: |
          cp .env.example .env
          docker compose config --quiet

  # ---------------------------------------------------------------------------
  # Version consistency (tag pushes only). A release version lives in FOUR
  # places that used to be kept in sync by hand and could silently drift:
  # the git tag, `frontend/package.json`'s `version` (the single source of
  # truth for the version shown in the app UI — see CHANGELOG.md's header),
  # the CHANGELOG section, and the Docker Hub image tags. This job makes the
  # git tag authoritative and FAILS THE RELEASE if the other two in-repo
  # copies disagree, so a mismatched version can never reach Docker Hub or a
  # GitHub Release. `push-images` and `github-release` both gate on it.
  # ---------------------------------------------------------------------------
  version-consistency:
    name: version consistency (tag vs package.json vs CHANGELOG)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Tag, package.json and CHANGELOG must agree
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version: $VERSION"

          PKG_VERSION="$(jq -r .version frontend/package.json)"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::frontend/package.json version is '$PKG_VERSION' but the tag is 'v$VERSION'." \
                 "Bump package.json to $VERSION (it drives the version shown in the app UI) and re-tag."
            exit 1
          fi

          if ! grep -qE "^## \[${VERSION//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section." \
                 "Move the [Unreleased] notes under a '## [$VERSION] - YYYY-MM-DD' heading and re-tag."
            exit 1
          fi

          echo "OK: tag v$VERSION, package.json $PKG_VERSION, and CHANGELOG all agree."

  # ---------------------------------------------------------------------------
  # Push images: re-runs the same two builds (hitting the type=gha cache from
  # build-images above, so this is a fast cache-restore + push, not a rebuild
  # from scratch) and pushes both to Docker Hub under mzahana/cortex and
  # mzahana/cortex-nginx. Runs for BOTH a `main` push and a `vX.Y.Z` tag push;
  # what differs is only which tags get applied (see the metadata steps):
  #
  #   main push  -> `edge` + `sha-<short>`   (newest development build)
  #   vX.Y.Z tag -> `X.Y.Z` + `X.Y` + `latest` + `sha-<short>`
  #
  # `latest` deliberately tracks the newest RELEASE, not the newest `main`
  # commit, because `docker-compose.prod.yml` defaults `CORTEX_IMAGE_TAG` to
  # `latest` — a NAS running the documented `pull && up -d` must land on a
  # released, tagged version rather than whatever merged into `main` an hour
  # ago. Use `edge` explicitly to deploy an unreleased build.
  # PRs and other branches never push images at all.
  # ---------------------------------------------------------------------------
  push-images:
    name: push images (Docker Hub)
    runs-on: ubuntu-latest
    needs: [build-images, version-consistency]
    # `version-consistency` is skipped on a `main` push; `always()` keeps this
    # job runnable then, while still refusing to run if it actually FAILED on
    # a tag push (a drifted version must never reach Docker Hub).
    if: >-
      always()
      && needs.build-images.result == 'success'
      && needs.version-consistency.result != 'failure'
      && needs.version-consistency.result != 'cancelled'
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata (app image)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: mzahana/cortex
          tags: |
            # Release tags — only ever produced by a `vX.Y.Z` tag push.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` = newest RELEASE (the prod-overlay default), never a
            # bare `main` commit; `edge` = newest `main` build.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            # Always applied, on both paths — the immutable, exact-commit tag.
            type=sha,format=short
      - name: Build and push the shared web/worker app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker metadata (nginx image)
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: mzahana/cortex-nginx
          tags: |
            # Release tags — only ever produced by a `vX.Y.Z` tag push.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` = newest RELEASE (the prod-overlay default), never a
            # bare `main` commit; `edge` = newest `main` build.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            # Always applied, on both paths — the immutable, exact-commit tag.
            type=sha,format=short
      - name: Build and push the nginx image (frontend baked in)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # ---------------------------------------------------------------------------
  # GitHub Release (tag pushes only). Creates the release from the CHANGELOG
  # section for this exact version, so the release notes, the CHANGELOG, the
  # `frontend/package.json` version shown in the app UI, and the Docker Hub
  # image tags are all the same text with no hand-copying. Gated on the same
  # `version-consistency` job as the image push, and on the images actually
  # having been published — a release must never point at tags that do not
  # exist on Docker Hub.
  # ---------------------------------------------------------------------------
  github-release:
    name: github release (from CHANGELOG)
    runs-on: ubuntu-latest
    needs: [version-consistency, push-images]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Print lines after this version's heading, stopping at the next one.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/          { exit }
            flag                      { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::Extracted empty release notes for $VERSION from CHANGELOG.md."
            exit 1
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "**Docker images** (public):"
            echo ""
            echo '```'
            echo "docker pull mzahana/cortex:${VERSION}"
            echo "docker pull mzahana/cortex-nginx:${VERSION}"
            echo '```'
            echo ""
            echo "Deploy with \`CORTEX_IMAGE_TAG=${VERSION}\`, or just \`latest\` — which now points at this release."
          } >> release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — updating its notes."
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
